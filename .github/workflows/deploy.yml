# Deploy the MyST HTML site to GitHub Pages.
name: MyST GitHub Pages Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The print editions add a TeX Live + Inkscape install and ~1 min of
    # XeLaTeX to what used to be an HTML-only job.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # The print editions are built first, and on purpose: `downloads:` in
      # myst.yml points at exports/, so the PDFs and the Word file have to be on
      # disk before MyST builds the site or the download menu comes out empty
      # (a warning, not an error -- see the static-action-file-copied rule).
      - uses: ./.github/actions/build-exports
        with:
          site-url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Build HTML
        run: npx myst build --html --check-links

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

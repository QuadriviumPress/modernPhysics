# Deploy the MyST HTML site to GitHub Pages.
name: MyST GitHub Pages Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write
  # Read-only access to other workflows' runs, so the step below can pull the
  # print editions out of the last Exports run.
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # HTML only. The print editions are no longer built here -- see the download
    # step below -- so this is back to a few minutes rather than the ~3 the
    # TeX Live install and XeLaTeX added to every push.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      # These checks are fast and require no TeX, Inkscape, or Pandoc. Running
      # them here also protects direct pushes to main that did not pass through
      # pull-request CI.
      - name: Validate project metadata and plugins
        run: npm run check:project && npm test

      # `downloads:` in myst.yml points at exports/, so the PDFs and the Word
      # file have to be on disk before MyST builds the site or the download menu
      # comes out empty (a warning, not an error -- see the
      # static-action-file-copied rule).
      #
      # They are never rebuilt by this workflow. Exports runs monthly, on `v*`
      # tags, and on demand. Prefer its newest unexpired artifacts so a monthly
      # refresh can reach the site; a tagged release is the durable fallback.
      - name: Fetch the print editions from the last Exports run
        id: exports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p exports

          run_id=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow exports.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')

          # Download each named artifact into a temporary directory first, so
          # an expired or incomplete run cannot leave a mixed export set.
          artifact_dir=$(mktemp -d)
          if [ -n "$run_id" ]; then
            artifacts_ok=true
            for name in modern-physics-exports modern-physics-docx; do
              gh run download "$run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --name "$name" \
                --dir "$artifact_dir" \
                || artifacts_ok=false
            done
            if [ "$artifacts_ok" = true ] \
              && [ -f "$artifact_dir/modern-physics.pdf" ] \
              && [ -f "$artifact_dir/modern-physics-student.pdf" ] \
              && [ -f "$artifact_dir/modern-physics.docx" ]; then
              mv "$artifact_dir"/* exports/
              rm -rf "$artifact_dir"
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "source=latest Exports workflow artifacts" >> "$GITHUB_OUTPUT"
              echo "source_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          rm -rf "$artifact_dir"

          # Release assets do not expire, so retain them as the fallback if the
          # newest workflow artifacts are absent, incomplete, or expired.
          release_dir=$(mktemp -d)
          if gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern 'modern-physics.pdf' \
            --pattern 'modern-physics-student.pdf' \
            --pattern 'modern-physics.docx' \
            --dir "$release_dir" \
            && [ -f "$release_dir/modern-physics.pdf" ] \
            && [ -f "$release_dir/modern-physics-student.pdf" ] \
            && [ -f "$release_dir/modern-physics.docx" ]; then
            release_url=$(gh release view --repo "$GITHUB_REPOSITORY" --json url --jq '.url')
            mv "$release_dir"/* exports/
            rm -rf "$release_dir"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "source=latest GitHub release" >> "$GITHUB_OUTPUT"
            echo "source_url=$release_url" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -rf "$release_dir"

          echo "::warning::No complete export set was found. Run the Exports workflow once to populate the site's PDF and Word downloads."
          echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Build HTML
        run: npx myst build --html --check-links

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_build/html

      - name: Write build summary
        if: always()
        run: |
          {
            echo "## Print editions on this deploy"
            echo
            if [ "${{ steps.exports.outputs.found }}" = "true" ]; then
              echo "Taken from [${{ steps.exports.outputs.source }}](${{ steps.exports.outputs.source_url }})."
              echo
              echo "| File | Size |"
              echo "|------|------|"
              for f in exports/*.pdf exports/*.docx; do
                [ -e "$f" ] || continue
                printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
              done
            else
              echo "None -- no successful Exports run to pull from. The download menu will be empty."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

# Build the printable editions -- the two book PDFs, the fourteen chapter
# offprints, and the Word document -- and keep them as workflow artifacts.
#
# This is the only place they are built. deploy.yml used to run the same steps
# on every push to main, which cost every one-word prose fix a TeX Live install
# and a XeLaTeX pass; it now downloads this workflow's most recent successful
# artifacts instead. So the download menu on the published site tracks the last
# tag (or the last manual run here), not the tip of main.
#
# Keeping it out of ci.yml also keeps pull request feedback fast and HTML-only:
# the TeX Live and Inkscape install alone is a few minutes.
#
# The toolchain and build steps live in .github/actions/build-exports.
name: Exports

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: exports-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PDF and DOCX
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-exports
        with:
          site-url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      # 90 days is the ceiling, and worth asking for: deploy.yml serves the site's
      # downloads out of these artifacts, so once they expire the download menu
      # goes empty until the next tag or manual run.
      - uses: actions/upload-artifact@v7
        with:
          name: modern-physics-exports
          path: exports/*.pdf
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v7
        with:
          name: modern-physics-docx
          path: exports/*.docx
          if-no-files-found: error
          retention-days: 90

      - name: Write build summary
        if: always()
        run: |
          {
            echo "## Print editions"
            echo
            echo "| File | Size |"
            echo "|------|------|"
            for f in exports/*.pdf exports/*.docx; do
              [ -e "$f" ] || continue
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

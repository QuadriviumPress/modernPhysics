<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 410" role="img" aria-labelledby="title desc">
  <title id="title">Energy–momentum relation</title>
  <desc id="desc">A right triangle relates total energy E, momentum pc, and rest energy mc squared.</desc>
  <rect width="700" height="410" fill="#fff"/>
  <text x="350" y="30" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">The energy–momentum relation</text>
  <line x1="145" y1="330" x2="555" y2="330" stroke="#333" stroke-width="3"/>
  <line x1="145" y1="330" x2="145" y2="90" stroke="#333" stroke-width="3"/>
  <line x1="145" y1="330" x2="510" y2="105" stroke="#1769aa" stroke-width="5"/>
  <path d="M145 330 L510 330 L510 105 Z" fill="#eaf4fb" opacity=".9"/>
  <text x="330" y="365" text-anchor="middle" font-family="serif" font-size="23">pc</text>
  <text x="105" y="215" text-anchor="middle" font-family="serif" font-size="23">mc²</text>
  <text x="340" y="190" text-anchor="middle" font-family="serif" font-size="23" fill="#1769aa">E</text>
  <text x="350" y="397" text-anchor="middle" font-family="sans-serif" font-size="17">E² = (pc)² + (mc²)²</text>
  <text x="570" y="110" font-family="sans-serif" font-size="16">total energy</text>
  <text x="565" y="330" font-family="sans-serif" font-size="16">momentum term</text>
  <text x="45" y="88" font-family="sans-serif" font-size="16">rest-energy term</text>
</svg>

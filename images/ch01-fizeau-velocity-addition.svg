<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">Fizeau experiment and velocity addition</title>
  <desc id="desc">Light travels through moving water. The measured drag is between no drag and full Galilean drag, matching the Fresnel coefficient.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1769aa"/></marker></defs>
  <rect width="760" height="330" fill="#fff"/>
  <text x="380" y="31" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">Fizeau experiment: partial light drag</text>
  <rect x="95" y="88" width="570" height="105" rx="18" fill="#d9f0fa" stroke="#377d9b" stroke-width="3"/>
  <text x="380" y="120" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#20566d">moving water, refractive index n</text>
  <line x1="135" y1="158" x2="625" y2="158" stroke="#1769aa" stroke-width="5" marker-end="url(#a)"/>
  <text x="380" y="151" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1769aa">water speed v</text>
  <line x1="180" y1="215" x2="580" y2="215" stroke="#333" stroke-width="2"/>
  <line x1="180" y1="260" x2="580" y2="260" stroke="#333" stroke-width="2"/>
  <text x="165" y="221" text-anchor="end" font-family="sans-serif" font-size="16">no drag</text>
  <text x="165" y="266" text-anchor="end" font-family="sans-serif" font-size="16">full Galilean drag</text>
  <circle cx="375" cy="215" r="8" fill="#e6a21a"/><circle cx="540" cy="260" r="8" fill="#e6a21a"/>
  <line x1="375" y1="215" x2="540" y2="215" stroke="#e6a21a" stroke-width="4" marker-end="url(#a)"/>
  <text x="380" y="303" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333">u = c/n + v(1 − 1/n²) &nbsp;: measured between the two limits</text>
</svg>

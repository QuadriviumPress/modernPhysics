<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Fixed-target and collider thresholds</title>
  <desc id="desc">A fixed-target collision has forward momentum and leaves less energy for new mass, while a head-on collider has zero total momentum and makes more energy available.</desc>
  <rect width="760" height="390" fill="#fff"/>
  <text x="380" y="29" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">Why colliders reach higher energies</text>
  <line x1="45" y1="190" x2="715" y2="190" stroke="#bbb" stroke-width="2"/>
  <text x="190" y="70" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">fixed target</text>
  <circle cx="90" cy="190" r="18" fill="#3c78a8"/><circle cx="350" cy="190" r="18" fill="#777"/>
  <path d="M115 190 H320" stroke="#1769aa" stroke-width="6" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1769aa"/></marker></defs>
  <path d="M370 190 C430 135 490 135 550 190" fill="none" stroke="#e6a21a" stroke-width="4" stroke-dasharray="8 6"/>
  <text x="220" y="235" text-anchor="middle" font-family="sans-serif" font-size="15">net forward momentum remains</text>
  <text x="190" y="275" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#8d2c2c">much of E stays in CM motion</text>
  <text x="570" y="70" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">head-on collider</text>
  <circle cx="430" cy="190" r="18" fill="#3c78a8"/><circle cx="690" cy="190" r="18" fill="#777"/>
  <path d="M455 190 H555" stroke="#1769aa" stroke-width="6" marker-end="url(#a)"/><path d="M665 190 H565" stroke="#b33a3a" stroke-width="6" marker-end="url(#a)"/>
  <circle cx="560" cy="190" r="25" fill="#e6a21a" opacity=".8"/>
  <text x="560" y="235" text-anchor="middle" font-family="sans-serif" font-size="15">total p = 0</text>
  <text x="570" y="275" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#28733b">maximum energy available for new mass</text>
  <text x="380" y="350" text-anchor="middle" font-family="sans-serif" font-size="16">same beam energy ≠ same center-of-momentum energy</text>
</svg>
